<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOTA Training Progress Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">IOTA Training Progress Viewer</h1>
        <form method="POST">
            <div class="mb-3">
                <textarea class="form-control" name="jsonl_data" rows="10" placeholder="Paste your IOTA training steps JSONL data here"></textarea>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">View</button>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
